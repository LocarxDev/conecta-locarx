# Conecta LocarX — front-end (Netlify)
# Publicar arrastando a PASTA "web" inteira no Netlify.

[build]
  publish = "."

# PASSO OBRIGATÓRIO antes de publicar: tirar o # das 5 linhas abaixo e trocar SEU-BACKEND
# pelo endereço gerado no Railway (Settings → Networking). Veja o README.
# Assim o navegador só enxerga /api — a URL do Railway não aparece no código da página.
# [[redirects]]
#   from = "/api/*"
#   to = "https://SEU-BACKEND.up.railway.app/api/:splat"
#   status = 200
#   force = true

# Qualquer endereço abre o sistema (F5 em qualquer tela funciona)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
